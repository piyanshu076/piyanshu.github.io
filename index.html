<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Question</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#ffe6ec;
}

.container{
    text-align:center;
}

img{
    width:220px;
    margin-bottom:20px;
}

h2{
    margin-bottom:20px;
}

.button-container{
    position:relative;
    width:300px;
    height:120px;
    margin:auto;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    font-size:16px;
}

#yesBtn{
    background:#ff5f9e;
    color:white;
}

#noBtn{
    background:#ddd;
    position:absolute;
    left:170px;
}

.result{
    display:none;
}
</style>
</head>
<body>

<div class="container question-container">
    <img src="https://media.tenor.com/YTw87WdiaasAAAAi/tkthao219-bubududu.gif" alt="cute gif">

    <h2>Do you love me?</h2>

    <div class="button-container">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<div class="container result">
    <img src="https://media.tenor.com/xI8X94Z_emgAAAAi/tkthao219-bubududu.gif" alt="love gif">

    <h2>I knew it 😍</h2>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 250;
    const y = Math.random() * 100;

    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
});

yesBtn.addEventListener("click", () => {
    document.querySelector(".question-container").style.display = "none";
    document.querySelector(".result").style.display = "block";
});
</script>

</body>
</html>
